<div class="controls">
	<div class="toggles">
		@for (entry of entries(); track entry.key) {
			<label class="toggle" [class.active]="entry.active">
				<input type="checkbox" [checked]="entry.active" (change)="toggle(entry.key)" />
				<span class="indicator"></span>
				<span class="label">{{ entry.label }}</span>
			</label>
		}
	</div>
	<div class="attribution">
		Powered by
		<a href="https://www.tradingview.com/lightweight-charts/" target="_blank" rel="noopener">
			TradingView Lightweight Charts
		</a>
	</div>
</div>
