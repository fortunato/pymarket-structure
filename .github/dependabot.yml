# Dependabot version updates — one grouped PR per ecosystem per month.
# Security updates are opened independently of this schedule.
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # Angular / TypeScript majors are migrated deliberately via `ng update`.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ["*"]
